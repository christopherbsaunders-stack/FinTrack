<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Financial Summary</title>
  <style>
    :root {
      --text: #0b0b0b; --text-2: #52514e; --muted: #6f6d67; --border: #d9d8d3; --grid: #ebeae6; --bg: #f4f4f1; --paper: #fff;
      --accent: #2a78d6; --s1: #2a78d6; --s2: #eb6834; --good: #006300; --bad: #b42323;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.45; font-variant-numeric: tabular-nums; }
    [hidden] { display: none !important; }
    .toolbar { position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--border); padding: 12px 16px; }
    .toolbar-inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .toolbar .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .toolbar label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-2); flex: 1 1 260px; }
    .toolbar input, .toolbar textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; width: 100%; }
    .toolbar textarea { min-height: 60px; resize: vertical; }
    button, a.btn { font: inherit; font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
    a.btn.ghost { background: transparent; color: var(--text); border-color: var(--border); }
    .muted { color: var(--muted); } .small { font-size: 11.5px; }
    .page { max-width: 860px; margin: 20px auto 60px; background: var(--paper); border: 1px solid var(--border); border-radius: 10px; padding: 36px 40px; }
    h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
    h2 { font-size: 15px; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--text); }
    h3 { font-size: 13px; margin: 14px 0 6px; }
    header.doc { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    section { margin-top: 26px; }
    .figures { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    @media (max-width: 640px) { .figures { grid-template-columns: repeat(2, 1fr); } .page { padding: 22px 16px; } }
    .fig { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .fig .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
    .fig .v { font-size: 18px; font-weight: 700; margin-top: 2px; }
    .fig.main .v { font-size: 24px; }
    .fig .s { font-size: 11.5px; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; padding: 5px 6px; border-bottom: 1px solid var(--border); }
    td { padding: 5px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; }
    td.n, th.n { text-align: right; white-space: nowrap; }
    tr.sub td { color: var(--text-2); padding-left: 22px; font-size: 12px; }
    tr.cat td { font-weight: 650; background: var(--bg); }
    tr.total td { font-weight: 700; border-top: 1.5px solid var(--text); border-bottom: 0; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    @media (max-width: 640px) { .two { grid-template-columns: 1fr; } }
    .loan { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-top: 10px; break-inside: avoid; }
    .loan-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 18px; margin-top: 6px; }
    @media (max-width: 640px) { .loan-grid { grid-template-columns: 1fr 1fr; } }
    .kv .k { font-size: 11px; color: var(--muted); } .kv .v { font-weight: 600; }
    .up { color: var(--good); } .down { color: var(--bad); }
    .note { font-size: 11.5px; color: var(--text-2); margin: 6px 0 0; }
    .notes-text { white-space: pre-wrap; border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; }
    ul.caveats { margin: 6px 0 0; padding-left: 18px; color: var(--text-2); font-size: 12px; }
    .chart svg { display: block; width: 100%; height: auto; }
    .chart text { fill: var(--muted); font-size: 10px; }
    @media print {
      @page { margin: 14mm 12mm; }
      body { background: #fff; font-size: 11.5px; }
      .toolbar { display: none; }
      .page { border: 0; margin: 0; padding: 0; max-width: none; border-radius: 0; }
      section { break-inside: auto; }
      h2, h3 { break-after: avoid-page; }
      .fig, tr, .loan { break-inside: avoid; }
      .figures { grid-template-columns: repeat(4, 1fr); }
      .two { grid-template-columns: 1fr 1fr; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="row">
        <label>Prepared for <input id="rName" maxlength="120" placeholder="Your names, e.g. Chris and Sam Saunders"></label>
        <button type="button" id="printBtn">Print or save as PDF</button>
        <a class="btn ghost" href="/">Back to dashboard</a>
      </div>
      <label>Notes and questions for your advisor (printed at the end) <textarea id="rNotes" placeholder="What you'd like to talk about: goals, worries, upcoming expenses..."></textarea></label>
      <div class="row small"><span class="muted">Spreadsheets of the same numbers:</span> <span id="csvLinks"></span> <span class="muted" id="saveState"></span></div>
    </div>
  </div>
  <main class="page" id="report"><p class="muted">Loading…</p></main>
  <script type="module" src="report.js"></script>
</body>
</html>
